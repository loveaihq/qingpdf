[workspace]
resolver = "3"
members = ["crates/qingpdf-base", "crates/qingpdf-core", "crates/qingpdf-cli", "crates/qingpdf-view", "crates/qingpdf-view-bin"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The reader (the library `qingpdf-view`: no pixel work in it, the engine draws and Windows puts it on the screen) is built for size:
# 94 KB off qingpdf-view.exe, and no time that matters changed (docs/decisions.md, 4b). It is a library of its own because the
# link-time optimization of the whole program runs at the level of the final crate: with this setting on the program itself the engine
# is optimized for size too (141 KB off, but the pages take 28 % longer to draw). The engine stays at opt-level 3: at 2 they take
# 20 to 28 % longer as well.
[profile.release.package.qingpdf-view]
opt-level = "z"

# The operations on pages (`ops`, `prune`, `image`), the form fields (`forms`, `layout`), the editing and the reader's server
# (qingpdf-core: everything in it runs once for each thing the person does, not for each pixel or each byte of a file; what decides
# the speed of reading, text, drawing and writing is in qingpdf-base, which stays at opt-level 3) are built for size (docs/decisions.md,
# 4c, and "瘦身第二次": moving `ops`, `prune`, `image` and the forms out of qingpdf-base took 64 KB off the programs; `writer`
# stayed: at this setting `split` and `merge` took 8 to 12 % longer).
[profile.release.package.qingpdf-core]
opt-level = "z"

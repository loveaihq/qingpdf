[package]
name = "qingpdf-cli"
description = "Command-line interface for qingpdf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "qingpdf"
path = "src/main.rs"

[dependencies]
qingpdf-core = { path = "../qingpdf-core" }

[dev-dependencies]
png = "0.18.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Same rules as the engine: nothing from a file or the command line may panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

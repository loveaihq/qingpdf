[package]
name = "qingpdf-core"
description = "PDF engine for qingpdf: the reader's engine and the editing, on top of qingpdf-base (built for size)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
qingpdf-base = { path = "../qingpdf-base" }
miniz_oxide = "0.9.1"

[dev-dependencies]
qingpdf-base = { path = "../qingpdf-base", features = ["testutil"] }
png = "0.18.1"
aes = "0.9.3"
md-5 = "0.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Every PDF is untrusted input: the engine must never panic on file data.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[package]
name = "qingpdf-core"
description = "PDF engine for qingpdf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
miniz_oxide = "0.9.1"
png = "0.18.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Every PDF is untrusted input: the engine must never panic on file data.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

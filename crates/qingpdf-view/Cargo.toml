[package]
name = "qingpdf-view"
description = "The reader of qingpdf: the window around the engine (a library of its own, so that it can be built for size while the program that links it is not)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
qingpdf-core = { path = "../qingpdf-core" }
# The shapes of the window (rounded corners, the mark, the thin bars) are drawn with the same rasterizer the engine already links: the same
# version and features as `qingpdf-base`, so no new package comes into the build (docs/decisions.md, 界面重做第一步).
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[lints.rust]
# `unsafe` is allowed in one module only, `win32.rs` (it calls Windows). `forbid` cannot be lifted for a module,
# so the rule is `deny` here and `#[allow(unsafe_code)]` on that module alone.
unsafe_code = "deny"

[lints.clippy]
# The same rules as the engine: nothing from a file, the command line or the window may panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Every `unsafe` block says why it is sound.
undocumented_unsafe_blocks = "deny"
